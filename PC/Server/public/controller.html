<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GUM 통신 시험 · 컨트롤러</title><link rel="stylesheet" href="/style.css">
<main><p class="eyebrow">GUM FIELD · 가짜 센서 송신</p><h1>테스트 컨트롤러</h1>
  <p>실제 휴대폰 센서 대신 시험값을 보냅니다. PC에서 시작 신호를 보내면 송신합니다. 브라우저를 뒤로 보내면 송신 주기가 느려질 수 있습니다.</p>
  <form id="join-form"><label>서버 주소<input id="server-url" required></label>
    <label>방 PIN<input id="pin" maxlength="6" required autocomplete="off"></label>
    <button id="join">입장</button><button id="leave" type="button">나가기</button>
  </form>
  <section><h2 id="player">입장 전</h2><p id="status" role="status">서버 주소와 PIN을 입력해 주세요.</p>
    <label>송신 목표 (회/초)<input id="rate" type="number" min="1" max="120" value="60"></label>
    <label>가짜 가속도 x<input id="motion" type="range" min="-20" max="20" step="0.1" value="0"></label>
    <label>버튼 상태<select id="button"><option value="0">입력 없음 (0)</option><option value="1">방어 (1)</option><option value="2">강타 충전 (2)</option></select></label>
    <div class="actions"><button id="calibrate" disabled>영점 확인 보내기</button><button id="pause">시험 송신 일시정지</button></div>
    <p id="counts">송신 대기</p><pre id="events"></pre>
  </section>
</main><script src="/protocol.js"></script><script src="/controller.js"></script>
</html>
